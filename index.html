<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotor Relay</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2648; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #fff4e6; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 14px; pointer-events: none; text-shadow: 0 1px 2px #0008; white-space: pre; }
    #prompt { position: fixed; bottom: 44px; left: 0; right: 0; text-align: center; font-size: 16px; pointer-events: none; text-shadow: 0 1px 3px #000a; }
    #board { position: fixed; top: 12px; right: 14px; width: min(360px, 60vw); pointer-events: none; background: #1d1830b0; border-radius: 6px; padding: 8px 10px; text-shadow: 0 1px 2px #0008; }
    #board .head { font-weight: bold; letter-spacing: .1em; margin-bottom: 4px; display: flex; justify-content: space-between; }
    #board .job { margin-top: 6px; padding-top: 6px; border-top: 1px solid #fff3; }
    #board .dim { opacity: .65; }
    #board .fire { color: #ff7a4a; } #board .cargo { color: #ffd060; } #board .rescue { color: #6fdcff; } #board .heavy { color: #9fd0ff; } #board .follow { color: #8be28b; }
    #compass { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(360px, 56vw); height: 36px; overflow: hidden; pointer-events: none; background: #1d18301c; border-radius: 6px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
    #compass .tape { position: absolute; top: 3px; left: 0; height: 100%; text-shadow: 0 1px 2px #0008; }
    #compass .tape span { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; opacity: .7; }
    #compass .tape span.card { font-size: 14px; font-weight: bold; opacity: 1; }
    #compass .tape span.card.n { color: #ff7a4a; }
    #compass::before { content: ''; position: absolute; left: 50%; top: 20px; width: 2px; height: 8px; margin-left: -1px; background: #fff4e6; }
    #compass .goal { position: absolute; top: 19px; transform: translateX(-50%); font-size: 12px; font-weight: bold; white-space: nowrap; text-shadow: 0 1px 2px #000a; }
    #compass .goal.fire { color: #ff7a4a; } #compass .goal.cargo { color: #ffd060; } #compass .goal.rescue { color: #6fdcff; }
    #meter { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); width: min(340px, 50vw); text-align: center; pointer-events: none; text-shadow: 0 1px 2px #0008; }
    #meter .row { display: flex; gap: 8px; align-items: center; }
    .bar { flex: 1; height: 10px; background: #0005; border-radius: 5px; overflow: hidden; margin: 4px 0; }
    .bar i { display: block; height: 100%; background: #ffb347; transition: width .2s; }
    .bar i.hot { background: #ff4a2a; }
    .bar.thin { height: 4px; } .bar.thin i { background: #6fdcff; }
    .combo { color: #6fdcff; font-weight: bold; }
    #overlay { position: fixed; inset: 0; display: grid; place-content: safe center; overflow-y: auto; text-align: center; background: #1d1830a0; font-size: 15px; padding: 16px; }
    #overlay h1 { font-size: 34px; letter-spacing: .2em; margin: 0 0 8px; }
    #overlay table { margin: 12px auto; border-spacing: 18px 4px; text-align: left; }
    #overlay td:last-child { text-align: right; } #overlay .big td { font-size: 20px; font-weight: bold; color: #ffd060; }
    #overlay .dim { opacity: .7; }
    #overlay table.hangar { border-spacing: 14px 6px; } #overlay th { text-align: left; opacity: .6; font-weight: normal; letter-spacing: .15em; padding-top: 8px; }
    #overlay .msg { color: #ffd060; min-height: 1.4em; }
    /* Menus: the HUD only shows while flying (body[data-mode] is set by main.js). */
    body:not([data-mode=shift]):not([data-mode=free]) :is(#hud, #board, #help, #prompt, #compass), body:not([data-mode=shift]) #meter { display: none; }
    #overlay.side { place-content: center start; text-align: left; padding-left: max(16px, 7vw); background: linear-gradient(90deg, #1d1830e0 0%, #1d183099 38%, #1d183000 65%); }
    #overlay.side h1 { font-size: 46px; margin: 0; }
    #overlay .tag { margin: 0 0 18px; opacity: .75; letter-spacing: .3em; text-transform: uppercase; font-size: 12px; }
    #overlay .small { font-size: 12px; max-width: 380px; }
    #overlay .credit { font-size: 11px; opacity: .45; max-width: 380px; }
    .menu { display: flex; flex-direction: column; gap: 8px; margin: 14px auto; width: min(380px, 100%); }
    #overlay.side .menu { margin: 14px 0; }
    .menu.row { flex-direction: row; flex-wrap: wrap; justify-content: center; width: auto; }
    .menu button { font: inherit; color: inherit; text-align: left; background: #fff1; border: 1px solid #fff3; border-radius: 6px; padding: 10px 14px; cursor: pointer; transition: background .15s, border-color .15s; }
    .menu button:hover, .menu button:focus-visible { background: #ffb34730; border-color: #ffb347; outline: none; }
    .menu button b { color: #ffd060; margin-right: 12px; }
    .menu button span { display: block; margin-top: 2px; font-size: 12px; opacity: .65; }
    .menu button span:empty { display: none; }
    #overlay tr[data-key] { cursor: pointer; } #overlay tr[data-key]:hover td { color: #ffd060; }
    #overlay.settings { display: block; overflow-y: auto; text-align: left; }
    #overlay.settings > div { max-width: 940px; margin: 0 auto; }
    #overlay.settings h1 { font-size: 28px; text-align: center; }
    #overlay h2 { font-size: 13px; letter-spacing: .15em; text-transform: uppercase; opacity: .6; font-weight: normal; margin: 18px 0 6px; }
    .ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 4px 28px; }
    .ctl h3 { margin: 10px 0 4px; font-size: 13px; letter-spacing: .1em; color: #ffd060; }
    #overlay .ctl table { margin: 0; border-spacing: 0; width: 100%; }
    .ctl td { padding: 3px 0; vertical-align: middle; border-bottom: 1px solid #fff1; }
    #overlay .ctl td:first-child { width: 1%; white-space: nowrap; padding-right: 14px; } #overlay .ctl td:last-child { text-align: left; }
    kbd { font: inherit; font-size: 12px; font-weight: bold; color: #ffd060; background: #fff1; border: 1px solid #fff4; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; margin-right: 3px; display: inline-block; min-width: 14px; text-align: center; }
    .opts label { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #fff1; cursor: pointer; }
    .opts label span { flex: 1; } .opts input[type=range] { width: min(200px, 45vw); accent-color: #ffb347; } .opts input[type=checkbox] { width: 18px; height: 18px; accent-color: #ffb347; }
    .opts output { width: 3.5em; text-align: right; color: #ffd060; }
    #help { position: fixed; bottom: 12px; left: 14px; pointer-events: none; opacity: .8; text-shadow: 0 1px 2px #0008; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="board"></div>
  <div id="compass"><div class="tape"></div><div class="goal"></div></div>
  <div id="meter"></div>
  <div id="overlay"></div>
  <div id="prompt"></div>
  <div id="help">W/S pitch · A/D turn · Q/E strafe · Space/Shift climb/descend · F action · R bucket/hook · Z/C winch · 1–5 take call · X abandon · mouse drag look · wheel zoom · M mute</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
